<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://base44.com/logo_v2.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // Theme before first paint, so there is no flash. A choice made with
      // the header toggle (saved in localStorage) wins; otherwise follow the
      // system setting. Tailwind is configured with darkMode: "class".
      (function () {
        try {
          var mq = window.matchMedia("(prefers-color-scheme: dark)");
          var stored = function () {
            try { return localStorage.getItem("chobi_theme"); } catch (e) { return null; }
          };
          var apply = function () {
            var s = stored();
            var dark = s ? s === "dark" : mq.matches;
            document.documentElement.classList.toggle("dark", dark);
          };
          apply();
          mq.addEventListener("change", function () {
            if (!stored()) apply();
          });
        } catch (e) {}
      })();
    </script>
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
    <title>Chobi — Full-res photo archive</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
