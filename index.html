<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://base44.com/logo_v2.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // Theme before first paint, so there is no flash. Light is the default
      // for everyone; dark applies only when the visitor chose it with the
      // header toggle. Tailwind is configured with darkMode: "class".
      (function () {
        try {
          var s = null;
          try { s = localStorage.getItem("chobi_theme"); } catch (e) {}
          document.documentElement.classList.toggle("dark", s === "dark");
        } catch (e) {}
      })();
    </script>
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
    <title>Chobi — Full-res photo archive</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
